name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: true
        default: 'My App'
      package_name:
        description: 'Package Identifier'
        required: true
        default: 'com.myapp.app'
      web_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      theme_color:
        description: 'Theme Hex Color'
        required: false
        default: '#0284c7'
      build_id:
        description: 'Unique Build Tracking ID'
        required: true
        default: 'ucd_1'
      icon_base64:
        description: 'Base64 Encoded App Icon PNG'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android Project Source
        run: |
          python3 generate_project.py             --app-name "${{ github.event.inputs.app_name }}"             --package-name "${{ github.event.inputs.package_name }}"             --web-url "${{ github.event.inputs.web_url }}"             --theme-color "${{ github.event.inputs.theme_color }}"             --build-id "${{ github.event.inputs.build_id }}"             --icon-base64 "${{ github.event.inputs.icon_base64 }}"

      - name: Build Android APK
        run: |
          cd android-app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare Output APK
        run: |
          mkdir -p output
          CLEAN_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr -cd '[:alnum:]')
          if [ -z "$CLEAN_NAME" ]; then CLEAN_NAME="App"; fi
          APK_PATH=$(find android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "output/${CLEAN_NAME}-${{ github.event.inputs.build_id }}.apk"
            echo "APK generated at output/${CLEAN_NAME}-${{ github.event.inputs.build_id }}.apk"
          else
            echo "ERROR: No APK found!"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.event.inputs.build_id }}" output/*.apk             --title "Release ${{ github.event.inputs.app_name }} (${{ github.event.inputs.build_id }})"             --notes "Generated automated APK by UCDreams Web to App Cloud Builder."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ github.event.inputs.build_id }}-apk"
          path: output/*.apk
